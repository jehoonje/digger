<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#fafaf9; --fg:#111110; --muted:#8a8986; --line:#e4e3e0; --field:#f1f0ee;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0e0d; --fg:#f2f1ee; --muted:#7d7c78; --line:#262624; --field:#1a1a19; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}

.screen{position:fixed;inset:0;overflow-y:auto;transition:opacity .6s ease,transform .6s ease}
.screen.out{opacity:0;transform:translateY(-8px);pointer-events:none}
.screen.pre{opacity:0;transform:translateY(8px);pointer-events:none}
@media (prefers-reduced-motion:reduce){.screen{transition:opacity .2s linear;transform:none!important}}

.inner{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 40px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.mark{font-weight:600;letter-spacing:.02em;font-size:15px;margin:0}

/* Gate */
#gate .inner{justify-content:center;gap:28px}
#gate .mark{font-size:28px;letter-spacing:-.01em}
#gateForm{display:flex;flex-direction:column;gap:12px}
.field{width:100%;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px;border-radius:0}
.field:focus{outline:none;border-bottom-color:var(--fg)}
.primary{padding:14px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:2px;cursor:pointer;font-weight:500}
.primary[disabled]{opacity:.5}
.msg{min-height:1.5em;margin:0;color:var(--muted);font-size:13px}

/* Main */
#main .inner{gap:28px}
.top{display:flex;justify-content:space-between;align-items:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost{padding:13px;border:1px solid var(--line);background:transparent;border-radius:2px;cursor:pointer;text-align:center;font-weight:500}
.ghost:hover{border-color:var(--fg)}
.busy .actions{opacity:.4;pointer-events:none}
.live{position:relative;width:100%;height:0;padding-bottom:100%;background:#000;overflow:hidden;border-radius:2px;margin-top:-16px}
.live video{width:100%!important;height:100%!important;max-width:none}
.live video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live .guide{position:absolute;left:50%;top:50%;width:90%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.55);border-radius:2px;transition:border-color .3s}
.live.steady .guide{border-color:#fff}
.live .tag{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);padding:4px 8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live.searching .tag::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.live.searching .tag::after{animation:none}}
.status{margin:-16px 0 0;color:var(--muted);font-size:13px;min-height:1.5em}

#secondForm{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#secondForm p{margin:0;font-size:14px}
#secondForm .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
#secondForm .primary{padding:12px 18px}
#result{display:flex;flex-direction:column;gap:20px}
.title{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
.meta{margin:6px 0 0;color:var(--muted);font-size:14px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:var(--field)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tracks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tracks button{display:flex;justify-content:space-between;gap:12px;width:100%;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.tracks button span:last-child{color:var(--muted)}
.tracks button[aria-current="true"]{font-weight:600}
.related{display:flex;flex-direction:column;gap:8px}
.related button{padding:11px 14px;border:1px solid var(--line);background:none;border-radius:2px;text-align:left;cursor:pointer;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.related button:hover,.related button[aria-current="true"]{color:var(--fg);border-color:var(--fg)}
</style>
</head>
<body>

<section class="screen" id="gate">
  <div class="inner">
    <p class="mark">Digger</p>
    <form id="gateForm" autocomplete="off">
      <input class="field" id="code" type="password" placeholder="Access code" aria-label="Access code" autofocus>
      <button class="primary" id="enter" type="submit">Enter</button>
      <p class="msg" id="gateMsg" role="status"></p>
    </form>
  </div>
</section>

<section class="screen pre" id="main" hidden>
  <div class="inner">
    <div class="top">
      <p class="mark">Digger</p>
    </div>

    <div class="actions">
      <button class="ghost" id="liveBtn" type="button">Stop camera</button>
      <label class="ghost" for="upload">Upload</label>
    </div>
    <div class="live" id="live" hidden>
      <video id="video" playsinline webkit-playsinline muted autoplay disablepictureinpicture></video>
      <div class="guide"></div>
      <span class="tag" id="liveTag">Starting camera…</span>
    </div>
    <input id="upload" type="file" accept="image/*" hidden>
    <p class="status" id="status" role="status"></p>

    <div id="secondSlot"></div>
    <template id="secondTpl">
    <form id="secondForm" autocomplete="off">
      <p id="secondText">Today's search limit has been reached.</p>
      <div class="row">
        <input class="field" id="code2" type="password" placeholder="Second access code" aria-label="Second access code">
        <button class="primary" id="enter2" type="submit">Continue</button>
      </div>
      <p class="msg" id="secondMsg" role="status"></p>
    </form>
    </template>

    <div id="result" hidden>
      <div>
        <h1 class="title" id="title"></h1>
        <p class="meta" id="meta"></p>
      </div>
      <div class="player" id="player"></div>
      <ul class="tracks" id="tracks"></ul>
      <div class="related" id="related"></div>
    </div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};
let lastFile = null;

async function api(path, opts = {}){
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "x-access-code": store.get("lp_code"), "x-second-code": store.get("lp_code2") } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401){ store.set("lp_code", ""); showGate(); throw new Error("Access code required."); }
  if (r.status === 402 && j.code === "second_code_required"){ store.set("lp_code2", ""); throw Object.assign(new Error(j.error), { secondCode: true }); }
  if (!r.ok) throw new Error(j.error || "Server error (" + r.status + ")");
  return j;
}

/* ---------- Gate ---------- */
function enterMain(){
  const gate = $("gate"), main = $("main");
  if (cam.wanted) startCamera();
  main.hidden = false;
  gate.classList.add("out");
  requestAnimationFrame(() => requestAnimationFrame(() => main.classList.remove("pre")));
  setTimeout(() => { gate.hidden = true; }, 650);
}
function showGate(){
  const gate = $("gate"), main = $("main");
  gate.hidden = false;
  requestAnimationFrame(() => gate.classList.remove("out"));
  main.classList.add("pre");
  setTimeout(() => { main.hidden = true; }, 650);
}
async function verify(code){
  const r = await fetch("/api/auth", { method: "POST", headers: { "x-access-code": code } });
  return r.ok;
}
$("gateForm").onsubmit = async e => {
  e.preventDefault();
  const code = $("code").value.trim();
  if (!code){ $("gateMsg").textContent = "Enter your access code."; return; }
  $("enter").disabled = true; $("gateMsg").textContent = "";
  try {
    if (await verify(code)){ store.set("lp_code", code); $("code").value = ""; enterMain(); }
    else $("gateMsg").textContent = "Incorrect code.";
  } catch { $("gateMsg").textContent = "Could not connect. Try again."; }
  finally { $("enter").disabled = false; }
};
(async () => {
  const saved = store.get("lp_code");
  if (saved && await verify(saved).catch(() => false)) enterMain();
})();

/* ---------- Second code ---------- */
let pendingRetry = null;
function hideSecond(){ $("secondSlot").textContent = ""; pendingRetry = null; }
function askSecond(retry, message){
  pendingRetry = retry;
  status("");
  if (!$("secondForm")){
    $("secondSlot").append($("secondTpl").content.cloneNode(true));
    $("secondForm").onsubmit = submitSecond;
  }
  if (message) $("secondText").textContent = message;
  $("secondMsg").textContent = "";
  $("code2").focus();
}
async function submitSecond(e){
  e.preventDefault();
  const code = $("code2").value.trim();
  if (!code){ $("secondMsg").textContent = "Enter the second access code."; return; }
  $("enter2").disabled = true;
  try {
    const r = await fetch("/api/auth?second=1", { headers: { "x-access-code": store.get("lp_code"), "x-second-code": code } });
    if (!r.ok){ $("secondMsg").textContent = "Incorrect code."; $("enter2").disabled = false; return; }
    store.set("lp_code2", code);
    const retry = pendingRetry;
    hideSecond();
    if (retry) retry();
  } catch { $("secondMsg").textContent = "Could not connect. Try again."; $("enter2").disabled = false; }
}

async function searchAndPlay(q, label){
  status("Searching…");
  try { const v = await api("/api/youtube?q=" + encodeURIComponent(q)); hideSecond(); showVideos(v.videos, label); status(""); }
  catch (e){ if (e.secondCode) askSecond(() => searchAndPlay(q, label), e.message); else status(e.message); }
}

/* ---------- Capture ---------- */
function status(t){ $("status").textContent = t; }
$("upload").onchange = handle;
document.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])][0]; if (f && !$("main").hidden) start(f); });
function handle(e){ const f = e.target.files?.[0]; e.target.value = ""; if (f) start(f); }
function start(file){ if (file.type.startsWith("image/")){ lastFile = file; recognize(file); } }

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1400 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => rej(new Error("Could not open this image."));
    img.src = URL.createObjectURL(file);
  });
}

let currentKey = "";
async function recognize(file){
  try { await recognizeImage(await shrink(file), false); } catch (err){ status(err.message); }
}

// 공용 인식 — 사진 업로드와 실시간 카메라가 함께 사용. 찾으면 true
async function recognizeImage(image, live){
  hideSecond();
  if (!live){ $("main").classList.add("busy"); status("Searching…"); }
  try {
    const j = await api("/api/recognize", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ image }) });
    if (!j.found){ if (!live) status("No match. Try a clearer, closer photo of the sleeve."); return false; }
    const key = (j.album.artist + "|" + j.album.album).toLowerCase();
    if (live && key === currentKey) return true; // 같은 앨범이면 재생 중인 곡을 그대로 둠
    currentKey = key;
    showAlbum(j.album);
    if (j.needSecond){
      const a = j.album, label = a.top_track || "Full album";
      askSecond(() => searchAndPlay(a.artist + " " + (a.top_track || a.album), label), j.secondMsg);
      return true;
    }
    showVideos(j.videos, j.album.top_track, !live);
    status(j.videos?.length ? "" : "No video found. Pick a track below.");
    return true;
  } catch (err){ status(err.message); return false; }
  finally { $("main").classList.remove("busy"); }
}

/* ---------- Live camera ---------- */
// 32x32 흑백 미리보기로 움직임을 재서, 1.2초 정도 멈춰 있으면 한 번 인식.
// 같은 장면은 다시 보내지 않고, 화면이 크게 바뀌어야 다음 인식을 함.
const cam = { stream: null, timer: null, prev: null, sent: null, armed: true, stableSince: 0, busy: false, wanted: true, doneAt: 0 };
const GUIDE = 0.9, SAMPLE_MS = 250, STEADY_MS = 1200, MOVE_LIMIT = 7, DETAIL_MIN = 16, AWAY_MIN = 12, SAME_MAX = 6, READY_AFTER = 1800;
const tiny = document.createElement("canvas"); tiny.width = tiny.height = 32;
const tctx = tiny.getContext("2d", { willReadFrequently: true });

function liveTag(t, cls){
  $("liveTag").textContent = t;
  $("live").classList.toggle("searching", cls === "searching");
}
function signature(){
  const v = $("video");
  const side = Math.min(v.videoWidth, v.videoHeight) * GUIDE; // 가이드 사각형 영역만
  tctx.drawImage(v, (v.videoWidth - side) / 2, (v.videoHeight - side) / 2, side, side, 0, 0, 32, 32);
  const d = tctx.getImageData(0, 0, 32, 32).data, g = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) g[i] = d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114;
  return g;
}
const diff = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; };
const detail = a => { let m = 0; for (const x of a) m += x; m /= a.length; let v = 0; for (const x of a) v += (x - m) ** 2; return Math.sqrt(v / a.length); };

// 가이드 사각형 + 약간의 여백만 잘라서 보냄 — 배경이 빠져 표지가 화면을 꽉 채움
function frameBase64(){
  const v = $("video");
  const side = Math.min(v.videoWidth, v.videoHeight) * Math.min(1, GUIDE + 0.06);
  const out = Math.min(1200, Math.round(side));
  const c = document.createElement("canvas");
  c.width = c.height = out;
  c.getContext("2d").drawImage(v, (v.videoWidth - side) / 2, (v.videoHeight - side) / 2, side, side, 0, 0, out, out);
  return c.toDataURL("image/jpeg", 0.9).split(",")[1];
}

// 인식이 끝나면 카메라가 다른 곳을 비출 때(움직임) 다음 인식이 준비되고,
// 다시 1.2초 멈추면 새 장면을 인식. 같은 LP로 돌아오면 다시 보내지 않음.
async function tick(){
  const v = $("video");
  if (!cam.stream || cam.busy || !v.videoWidth || $("secondForm")) return;
  const sig = signature(), now = performance.now();
  const moving = cam.prev ? diff(sig, cam.prev) > MOVE_LIMIT : true;
  cam.prev = sig;

  if (cam.sent && !cam.armed && diff(sig, cam.sent) > AWAY_MIN) cam.armed = true;
  if (cam.doneAt && now - cam.doneAt > READY_AFTER && !moving && !cam.armed) {
    cam.doneAt = 0; liveTag("Ready. Point at the next sleeve");
  }
  if (moving){
    cam.stableSince = now; $("live").classList.remove("steady");
    if (cam.armed && !cam.doneAt) liveTag("Point at a record sleeve");
    return;
  }
  $("live").classList.add("steady");
  if (!cam.armed) return;                                   // 방금 인식한 LP를 아직 비추는 중
  if (detail(sig) < DETAIL_MIN){ liveTag("Point at a record sleeve"); return; }
  if (cam.sent && diff(sig, cam.sent) < SAME_MAX) return;   // 같은 LP로 되돌아옴
  if (now - cam.stableSince < STEADY_MS){ liveTag("Hold steady…"); return; }

  cam.busy = true; cam.sent = sig; cam.armed = false;
  liveTag("Searching…", "searching");
  const found = await recognizeImage(frameBase64(), true);
  cam.busy = false; cam.doneAt = performance.now(); cam.prev = null;
  liveTag(found ? "Found: " + ($("title").textContent || "") : "No match. Try another angle");
}

// 아이폰 사파리는 같은 video 요소에 카메라를 다시 붙이면 비율·꽉 채우기 설정이 풀려서, 켤 때마다 새로 만듦
function freshVideo(){
  const v = document.createElement("video");
  v.id = "video"; v.muted = true; v.autoplay = true; v.playsInline = true;
  v.setAttribute("playsinline", ""); v.setAttribute("webkit-playsinline", ""); v.setAttribute("muted", "");
  v.disablePictureInPicture = true;
  v.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover";
  $("video").replaceWith(v);
  return v;
}

async function startCamera(){
  if (cam.stream) return;
  if (!navigator.mediaDevices?.getUserMedia){ status("Live camera isn't supported in this browser. Use Upload."); return setLiveUI(false); }
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    setLiveUI(true);                       // 화면에 보이는 상태에서 붙여야 크기가 바르게 잡힘
    const v = freshVideo();
    v.srcObject = cam.stream;
    await v.play().catch(() => {});
    cam.prev = null; cam.sent = null; cam.armed = true; cam.doneAt = 0; cam.stableSince = performance.now();
    liveTag("Point at a record sleeve");
    cam.timer = setInterval(tick, SAMPLE_MS);
  } catch (e){
    cam.stream = null; setLiveUI(false);
    status(e?.name === "NotAllowedError" ? "Camera access was blocked. Allow it in your browser settings, or use Upload." : "Could not start the camera. Use Upload.");
  }
}
function stopCamera(){
  clearInterval(cam.timer); cam.timer = null;
  cam.stream?.getTracks().forEach(t => t.stop()); cam.stream = null;
  $("video").srcObject = null;
  setLiveUI(false);
}
function setLiveUI(on){
  $("live").hidden = !on;
  $("liveBtn").textContent = on ? "Stop camera" : "Live scan";
}
$("liveBtn").onclick = () => { cam.wanted = !cam.stream; cam.wanted ? startCamera() : stopCamera(); };
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (cam.stream) { stopCamera(); cam.wanted = true; } }
  else if (cam.wanted && !$("main").hidden) startCamera();
});

/* ---------- Result ---------- */
function showAlbum(r){
  $("title").textContent = r.album || r.artist;
  $("meta").textContent = [r.artist, r.year, r.genre].filter(Boolean).join(" · ");
  const ul = $("tracks"); ul.textContent = "";
  const tracks = (Array.isArray(r.tracks) ? r.tracks : []).map(String);
  [...tracks.map(t => ({ label: t, q: r.artist + " " + t })), { label: "Full album", q: r.artist + " " + r.album + " full album" }]
    .forEach(t => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.dataset.label = t.label;
      const a = document.createElement("span"); a.textContent = t.label;
      const p = document.createElement("span"); p.textContent = "Play";
      b.append(a, p);
      b.onclick = () => searchAndPlay(t.q, t.label);
      li.append(b); ul.append(li);
    });
  $("result").hidden = false;
}

function showVideos(vids, label, scroll = true){
  [...$("tracks").querySelectorAll("button")].forEach(b => b.setAttribute("aria-current", String(b.dataset.label === label)));
  const box = $("related"); box.textContent = "";
  if (!vids?.length){ $("player").textContent = ""; return; }
  vids.forEach((v, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = v.title + " — " + v.channel;
    b.onclick = () => play(v, b);
    box.append(b);
    if (i === 0) play(v, b);
  });
  if (scroll) $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

function play(v, btn){
  $("player").innerHTML = '<iframe src="https://www.youtube.com/embed/' + encodeURIComponent(v.id) +
    '?autoplay=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="YouTube player"></iframe>';
  [...$("related").children].forEach(b => b.setAttribute("aria-current", String(b === btn)));
}
</script>
</body>
</html>
